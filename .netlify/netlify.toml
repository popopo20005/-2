headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[functions]

[functions."*"]

[build]
publish = "c:\\Users\\kanta\\Desktop\\quiz-app-deploy\\dist"
publishOrigin = "config"
commandOrigin = "config"
command = "npm run build"

[build.environment]
NODE_VERSION = "18"
CI = "false"

[build.processing]
skip_processing = false

[build.processing.css]
bundle = true
minify = true

[build.processing.html]
pretty_urls = true

[build.processing.images]

[build.processing.js]
bundle = true
minify = true

[build.services]

[[headers]]
for = "/"

[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"
Pragma = "no-cache"
Expires = "0"

[[headers]]
for = "/index.html"

[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.js"

[headers.values]
Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/*.css"

[headers.values]
Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/assets/*"

[headers.values]
cache-control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.js"

[headers.values]
cache-control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/*.css"

[headers.values]
cache-control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/index.html"

[headers.values]
cache-control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
for = "/manifest.json"

[headers.values]
cache-control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/sw.js"

[headers.values]
cache-control = "public, max-age=0, must-revalidate"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]